[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp-relay"
version = "0.2.4"
description = "Loopback WebSocket state relay for Imp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=16.0,<17"]

[project.scripts]
imp-relay = "imp_relay.__main__:main"
imp-gateway = "imp_relay.gateway_main:main"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pyinstaller>=6.22,<7",
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imp_relay"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
