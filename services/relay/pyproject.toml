[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyscry-relay"
version = "0.1.0"
description = "Loopback WebSocket state relay for TinyScry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=16.0,<17"]

[project.scripts]
tinyscry-relay = "tinyscry_relay.__main__:main"
tinyscry-gateway = "tinyscry_relay.gateway_main:main"

[dependency-groups]
dev = ["mypy>=1.19", "pytest>=9.0", "ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyscry_relay"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
