[package]
name = "tinyscry-desktop"
version = "0.1.0"
description = "TinyScry always-on-top companion HUD"
authors = ["TinyScry"]
edition = "2021"

[lib]
name = "tinyscry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tinyscry-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
