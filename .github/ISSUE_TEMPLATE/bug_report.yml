name: Bug report
description: Report something that failed or behaved unexpectedly in Imp.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Do not post credentials (including passwords), pairing tokens, SSH keys, raw GMCP data, private game text, or unredacted configuration files. Redact sensitive details from any excerpts or images.

        Report suspected security vulnerabilities privately using the [security policy](https://github.com/i-mud/imp/security/policy), not this form.

  - type: input
    id: version
    attributes:
      label: Installed Imp version
      description: Enter the installed release version, or write “Unknown” if you could not install or check it.
      placeholder: v0.5.3
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Connection mode
      options:
        - Local
        - Managed SSH
        - External SSH
        - Direct WSS
        - Not sure or not applicable

  - type: dropdown
    id: install
    attributes:
      label: Fresh install or upgrade?
      options:
        - Fresh install
        - Upgrade
        - Not sure or not applicable

  - type: input
    id: integration
    attributes:
      label: MUD, client, and desktop OS
      description: Include the client version if known. Omit anything private.
      placeholder: AVATAR / Mudlet / Windows 11 x64

  - type: dropdown
    id: checkpoint
    attributes:
      label: Last successful setup checkpoint
      description: Pick the furthest you got. A connected HUD or an old snapshot alone is not live state.
      options:
        - I did not reach a checkpoint
        - Found and downloaded the installer
        - Installed and opened Imp
        - Set up the Mudlet package or TinyFugue integration
        - Connected to the intended Imp node
        - Saw my own character state update during play
        - Not sure or not applicable

  - type: textarea
    id: behavior
    attributes:
      label: What did you expect, and what happened instead?
      description: Include what you were doing when it happened and steps to reproduce it if you know them. A short, redacted error message can help; no logs or screenshots are required.
    validations:
      required: true
