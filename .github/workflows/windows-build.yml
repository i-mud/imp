name: Windows Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'apps/desktop/**'
      - 'integrations/common/**'
      - 'integrations/mudlet/**'
      - 'services/relay/**'
      - 'packages/protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'scripts/build-desktop-node.py'
      - 'scripts/build-mudlet-package.py'
      - 'scripts/check-version.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'apps/desktop/**'
      - 'integrations/common/**'
      - 'integrations/mudlet/**'
      - 'services/relay/**'
      - 'packages/protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'scripts/build-desktop-node.py'
      - 'scripts/build-mudlet-package.py'
      - 'scripts/check-version.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mudlet-package:
    name: Mudlet package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build Mudlet package
        run: python scripts/build-mudlet-package.py --package-only

      - name: Upload Mudlet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Imp-mudlet-package-ci
          path: dist/mudlet/Imp.mpackage
          if-no-files-found: error
          retention-days: 14

  build:
    name: Windows x64 NSIS
    needs: mudlet-package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install dependencies
        run: npm ci

      - name: Install node build dependencies
        run: uv sync --locked --project services/relay

      - name: Build desktop node sidecar
        run: python scripts/build-desktop-node.py

      - name: Download Mudlet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Imp-mudlet-package-ci
          path: apps/desktop/src-tauri/resources/mudlet

      - name: Build Mudlet desktop helper
        run: python scripts/build-mudlet-package.py --desktop-resource --require-package

      - name: Check release version
        run: npm run release:check-version

      - name: Test native application
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features runtime-acceptance

      - name: Build NSIS installer
        run: npm run tauri --workspace @imp/desktop -- build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Imp-windows-x64-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
