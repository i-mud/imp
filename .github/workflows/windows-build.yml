name: Windows Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'apps/desktop/**'
      - 'packages/protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'scripts/check-version.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'apps/desktop/**'
      - 'packages/protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'scripts/check-version.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run release:check-version

      - name: Test native application
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri --workspace @tinyscry/desktop -- build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TinyScry-windows-x64-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
