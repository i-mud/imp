name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - run: npm ci

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint --

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          npm run commitlint --
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"

      - run: uv sync --locked --project services/relay
      - run: uv sync --locked --project integrations/tinyfugue
      - run: npm run check

      - name: Build server bundle
        run: ./scripts/build-server-bundle.sh

      - name: Test server bundle
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/server/imp-server-*-linux-x86_64.tar.gz)

          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one server archive, found ${#archives[@]}." >&2
            exit 1
          fi

          ./scripts/test-server-bundle.sh "${archives[0]}"
