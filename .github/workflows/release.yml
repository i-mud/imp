name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 NSIS release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        shell: pwsh
        run: node scripts/check-version.mjs --tag "$env:GITHUB_REF_NAME"

      - name: Test native application
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri --workspace @tinyscry/desktop -- build --bundles nsis

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(
            Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          )

          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $changelog = Get-Content "CHANGELOG.md" -Raw
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)"
          )

          if (-not $match.Success) {
            throw "CHANGELOG.md has no release section for $version."
          }

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $match.Groups["notes"].Value.Trim() |
            Set-Content -Path $notesFile -Encoding utf8NoBOM

          gh release create `
            "$env:GITHUB_REF_NAME" `
            "$($installers[0].FullName)" `
            --verify-tag `
            --prerelease `
            --latest=false `
            --notes-file "$notesFile" `
            --title "TinyScry $env:GITHUB_REF_NAME"
