name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check-version

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: node scripts/check-version.mjs --tag "$env:GITHUB_REF_NAME"

      - name: Test native application
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri --workspace @imp/desktop -- build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Imp-windows-x64-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  server:
    name: Linux x86_64 server bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Verify release version
        run: npm run release:check-version

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"

      - name: Build server bundle
        run: ./scripts/build-server-bundle.sh

      - name: Test server bundle
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/server/imp-server-*-linux-x86_64.tar.gz)

          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one server archive, found ${#archives[@]}." >&2
            exit 1
          fi

          ./scripts/test-server-bundle.sh "${archives[0]}"

      - name: Upload server bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Imp-server-linux-x86_64
          path: |
            dist/server/*.tar.gz
            dist/server/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Imp-windows-x64-nsis
          path: release

      - name: Download server bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Imp-server-linux-x86_64
          path: release

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          python3 - "$version" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          output = Path(sys.argv[2])
          changelog = Path("CHANGELOG.md").read_text()

          match = re.search(
              rf"(?ms)^## \[{re.escape(version)}\][^\r\n]*\r?\n"
              rf"(?P<notes>.*?)(?=^## |\Z)",
              changelog,
          )

          if match is None:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")

          output.write_text(match.group("notes").strip() + "\n")
          PY

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob

          installers=(release/*.exe)
          server_archives=(release/imp-server-*-linux-x86_64.tar.gz)
          server_checksums=(release/imp-server-*-linux-x86_64.tar.gz.sha256)

          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one NSIS installer, found ${#installers[@]}." >&2
            exit 1
          fi

          if (( ${#server_archives[@]} != 1 )); then
            echo "Expected exactly one server archive, found ${#server_archives[@]}." >&2
            exit 1
          fi

          if (( ${#server_checksums[@]} != 1 )); then
            echo "Expected exactly one server checksum, found ${#server_checksums[@]}." >&2
            exit 1
          fi

          gh release create \
            "$GITHUB_REF_NAME" \
            "${installers[0]}" \
            "${server_archives[0]}" \
            "${server_checksums[0]}" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "Imp $GITHUB_REF_NAME"
