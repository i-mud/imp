[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyscry-tinyfugue"
version = "0.1.0"
description = "TinyScry adapter for TinyFugue GMCP records"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tinyscry-relay",
  "websockets",
]

[project.scripts]
tinyscry-bridge = "tinyscry_tf.bridge:main"
tinyscry-capture = "tinyscry_tf.capture:main"
tinyscry-feed = "tinyscry_tf.feed:main"
tinyscry-action-consumer = "tinyscry_tf.action_consumer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyscry_tf"]

[tool.uv.sources]
tinyscry-relay = { path = "../../services/relay", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 110
# target-version is deliberately omitted: ruff derives it from
# requires-python, so the lint floor cannot drift from the declared one.
# Pinning it to the local interpreter once let Python 3.14-only `except`
# syntax past both gates and would have crashed on a 3.12 VPS.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
