[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp-tinyfugue"
version = "0.2.6"
description = "Imp adapter for TinyFugue GMCP records"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "imp-adapter",
  "imp-relay",
  "websockets",
]

[project.scripts]
imp-bridge = "imp_tf.bridge:main"
imp-capture = "imp_tf.capture:main"
imp-feed = "imp_tf.feed:main"
imp-action-consumer = "imp_tf.action_consumer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imp_tf"]

[tool.uv.sources]
imp-adapter = { path = "../common", editable = true }
imp-relay = { path = "../../services/relay", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 110
# target-version is deliberately omitted: ruff derives it from
# requires-python, so the lint floor cannot drift from the declared one.
# Pinning it to the local interpreter once let Python 3.14-only `except`
# syntax past both gates and would have crashed on a 3.12 VPS.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
