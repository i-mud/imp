[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp-mudlet"
version = "0.2.5"
description = "Imp adapter for Mudlet"
requires-python = ">=3.12"
dependencies = [
  "imp-adapter",
  "imp-relay",
]

[project.scripts]
imp-mudlet-bridge = "imp_mudlet.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imp_mudlet"]

[tool.uv.sources]
imp-adapter = { path = "../common", editable = true }
imp-relay = { path = "../../services/relay", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pyinstaller>=6.22,<7",
  "pytest>=9.0",
  "ruff>=0.15",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
