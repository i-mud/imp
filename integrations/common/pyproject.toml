[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp-adapter"
version = "0.3.2"
description = "Client-neutral GMCP normalization and local Imp node client"
requires-python = ">=3.12"
dependencies = [
  "imp-relay",
  "websockets",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imp_adapter"]

[tool.uv.sources]
imp-relay = { path = "../../services/relay", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pytest>=9.0",
  "ruff>=0.15",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
